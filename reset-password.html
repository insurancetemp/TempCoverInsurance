<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TempCover | Reset Password</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<style>
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px;background:linear-gradient(180deg,#ff7a00 0%,#ff8f1f 220px,#f7f7f7 220px)}
.card{width:100%;max-width:420px;background:#fff;border-radius:25px;padding:36px 28px;box-shadow:0 20px 45px rgba(0,0,0,.12)}
h1{text-align:center;font-size:28px;color:#222;margin:0 0 10px}
p{text-align:center;color:#666;line-height:1.55;margin:0 0 25px}
label{display:block;font-weight:600;margin:0 0 8px;color:#333}
input{width:100%;padding:15px;border:1px solid #ddd;border-radius:13px;font-size:16px;margin-bottom:18px}
input:focus{outline:none;border-color:#ff7a00;box-shadow:0 0 0 4px rgba(255,122,0,.13)}
button{width:100%;padding:17px;border:0;border-radius:14px;background:#ff7a00;color:#fff;font-size:17px;font-weight:bold;cursor:pointer}
button:disabled{opacity:.65;cursor:not-allowed}
#message{text-align:center;font-weight:600;line-height:1.5;margin-top:18px}
.back{text-align:center;margin-top:22px}.back a{color:#ff7a00;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<main class="card">
<h1>Choose a new password</h1>
<p>Enter and confirm your new password for your TempCover account.</p>
<form id="resetForm">
<label for="newPassword">New password</label>
<input id="newPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="Enter new password">
<label for="confirmPassword">Confirm new password</label>
<input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required placeholder="Re-enter new password">
<button id="saveButton" type="submit">Update password</button>
</form>
<div id="message"></div>
<div class="back"><a href="login.html">Back to sign in</a></div>
</main>
<script>
const message=document.getElementById("message");
supabaseClient.auth.onAuthStateChange((event,session)=>{
 if(event==="PASSWORD_RECOVERY"){message.style.color="#218838";message.textContent="Enter your new password above.";}
});
document.getElementById("resetForm").addEventListener("submit",async e=>{
 e.preventDefault();
 const password=document.getElementById("newPassword").value;
 const confirm=document.getElementById("confirmPassword").value;
 const button=document.getElementById("saveButton");
 if(password!==confirm){message.style.color="#d32f2f";message.textContent="The passwords do not match.";return;}
 button.disabled=true;button.textContent="Updating...";
 try{
  const {error}=await supabaseClient.auth.updateUser({password});
  if(error)throw error;
  message.style.color="#218838";
  message.textContent="Your password has been updated. You can now sign in with your new password.";
  document.getElementById("resetForm").reset();
  setTimeout(()=>window.location.href="login.html",2200);
 }catch(err){
  message.style.color="#d32f2f";
  message.textContent=err.message||"Unable to update password. Please request a new reset link.";
 }finally{button.disabled=false;button.textContent="Update password";}
});
</script>
</body>
</html>
